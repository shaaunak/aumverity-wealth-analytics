[project]
name = "aumverity-backend"
version = "0.1.0"
description = "AUMVERITY — Wealth Intelligence & Asset Movement Analytics Backend"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
