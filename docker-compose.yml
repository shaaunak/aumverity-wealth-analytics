services:
  postgres:
    image: postgres:16-alpine
    container_name: aumverity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aumverity}
      POSTGRES_USER: ${POSTGRES_USER:-aumverity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aumverity_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aumverity_pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aumverity} -d ${POSTGRES_DB:-aumverity}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    container_name: aumverity-backend
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aumverity}:${POSTGRES_PASSWORD:-aumverity_dev_password}@postgres:5432/${POSTGRES_DB:-aumverity}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    container_name: aumverity-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  aumverity_pgdata:
    driver: local
